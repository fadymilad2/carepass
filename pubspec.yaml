name: carepass
description: "CarePass healthcare provider discovery and membership in Ghana."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cached_network_image: ^3.3.1
  cloud_firestore: ^6.4.1
  cloud_functions: ^6.3.1
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.0.8
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  firebase_messaging: 16.3.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.0.1
  font_awesome_flutter: ^11.0.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  get_it: ^9.2.1
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  http: ^1.6.0
  intl: ^0.20.2
  permission_handler: ^12.0.1
  pin_code_fields: ^9.4.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  uuid: ^4.4.0
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/icons/app_icon.png
